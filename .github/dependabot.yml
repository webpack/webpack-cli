version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    versioning-strategy: widen
    ignore:
      # TODO remove it when webpack-cli requires Node.js >= 22.15.0, `rechoir` 1 requires it
      - dependency-name: "rechoir"
        versions: [">=1.0.0"]
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 20
    labels:
      - dependencies
    groups:
      dependencies:
        patterns:
          - "*"
